[tool.poetry]
name = "dicky-portfolio-backend"
version = "0.1.0"
description = "AI-powered portfolio backend with RAG and MCP integrations"
authors = ["Dicky Pratama <dickypratamss@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
langchain = "^0.1.0"
langchain-anthropic = "^0.1.0"
langchain-chroma = "^0.1.0"
chromadb = "^0.4.0"
anthropic = "^0.7.0"
sentence-transformers = "^2.2.0"
pypdf = "^3.17.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.0.0"
httpx = "^0.25.0"
slowapi = "^0.1.9"
google-auth-oauthlib = "^1.1.0"
google-auth-httplib2 = "^0.2.0"
google-api-python-client = "^2.100.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
respx = "^0.20.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
